<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="TitleScreen" class="gamebox">
        <div class="title-logo">Title logo</div>
        <button id="PlayButton">Play</button>
        <button id="CreditsButton">Credits</button>
    </div>

    <div id="BattleScreen" class="gamebox">
        <div id="battle-events" class="events-bar">events</div>

        <div class="battle-bg">
            <div class="battle-bg-label">Pozadina za borbu</div>
            <div id="EnemyContainer">
                <div id="enemy-1" class="enemySlot">enemy</div>
                <div id="enemy-2" class="enemySlot">enemy</div>
                <div id="enemy-3" class="enemySlot">enemy</div>
            </div>
        </div>

        <div class="battle-actions">
            <button id="AttackEnemyButton">Attack</button>
            <button id="DefendButton">Defend</button>
            <button id="CheckEnemyButton">Check</button>
            <button id="ConsumableItemButton">Item</button>
            <button id="SkipTurnButton">Skip turn</button>
        </div>
    </div>

    <div id="ShopScreen" class="gamebox">
        <div class="shop-top">
            <div id="weapon-details" class="weapon-details">
                Detalji i cena odabranog oruzja
                <button id="btn-buy-equip" class="btn-buy-equip">buy/equip</button>
            </div>

            <div class="shop-right-col">
                <div id="money-display" class="money-display">prikaz novca</div>
                <div id="shopkeeper-box" class="shopkeeper-box">Mesto za shopkeepera</div>
            </div>
        </div>

        <div class="shop-bottom">
            <div class="shop-tabs">
                <div class="tab-group">
                    <button id="tab-weapons" class="active-tab">Weapons</button>
                    <button id="tab-armor">Armor</button>
                    <button id="tab-items">Items</button>
                </div>
                <button id="btn-shop-exit">exit</button>
            </div>

            <div id="section-details" class="section-details">
                detalji za odabranu sekciju u shopu
            </div>
        </div>
    </div>

    <div id="WinScreen" class="gamebox">
        <div class="win-banner">
            <h1>BATTLE WON</h1>
            <div id="win-coins" class="coins-box">Coins:</div>
        </div>

        <div class="win-footer">
            <button id="btn-win-menu" class="btn-win-menu">back to main menu (youll lose your progress)</button>
            <button id="btn-next-battle" class="btn-next-battle">next battle</button>
            <button id="btn-win-shop" class="btn-win-shop">shop (unlocks after winning 2 battles)</button>
        </div>
    </div>

    <div id="LoseScreen" class="gamebox">
        <div class="lose-banner">
            <h1>BATTLE LOST</h1>
        </div>
        <button id="btn-lose-menu" class="btn-lose-menu">Back to main menu</button>
    </div>



    <div id="DebugTools">
        <h2>
            Debug tools
        </h2>

        <button id="ShowTitle" class="buttonShow">
            Show title screen
        </button>
    
        <button id="ShowBattle" class="buttonShow">
            Show battle screen
        </button>
    
        <button id="ShowShop" class="buttonShow">
            Show shop screen
        </button>

        <button id="ShowWin" class="buttonShow">
            Show win screen
        </button>

        <button id="ShowLose" class="buttonShow">
            Show lose screen
        </button>

        <button id="ShowCredits" class="buttonShow">
            Show credits screen
        </button>
    </div>
    
    <script src="libraries/Lodash.js"></script>
    <script src="script.js"></script>
</body>

</html>
